# =============================================================================
# SYNC TO LOGIMAX-TECHNOLOGIES ORGANIZATION
# For internal/source repos under Logimax-Technologies
# =============================================================================

name: 🔄 Sync to Logimax-Technologies

on:
  workflow_dispatch:
    inputs:
      client_repo:
        description: 'Select repository'
        required: true
        type: choice
        options:
          - retail_v5
          # Add other Logimax-Technologies repos as needed
      source_branch:
        description: 'Source branch to sync from'
        required: true
        default: 'Production'
        type: choice
        options:
          - Production
          - support
          - QA
      target_branch:
        description: 'Target branch in client repo'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - main
      auto_merge:
        description: 'Auto-merge if no conflicts'
        required: true
        default: true
        type: boolean

jobs:
  sync:
    uses: ./.github/workflows/sync-to-client.yml
    with:
      client_repo: ${{ inputs.client_repo }}
      client_org: Logimax-Technologies
      source_branch: ${{ inputs.source_branch }}
      target_branch: ${{ inputs.target_branch }}
      auto_merge: ${{ inputs.auto_merge }}
    secrets: inherit
