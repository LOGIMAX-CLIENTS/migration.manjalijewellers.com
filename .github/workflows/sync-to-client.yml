# =============================================================================
# SYNC SOURCE CODE TO CLIENT REPOSITORIES
# Pushes latest source code to selected client repos
# Creates PR if conflicts exist, auto-merges if clean
# 
# ACCESS CONTROL:
# - Requires 'client-sync' environment approval
# - Client list from: clients/registry.json
# - All syncs are logged to dashboard
# =============================================================================

