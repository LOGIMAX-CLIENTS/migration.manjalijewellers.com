version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8800:8800"
    volumes:
      - ./backend:/app
      - ../admin/logs:/etail/logs:ro
    environment:
      - DEVTOOLS_DEBUG=true
      - DEVTOOLS_ETAIL_ROOT=/etail
    command: uvicorn app.main:app --host 0.0.0.0 --port 8800 --reload
